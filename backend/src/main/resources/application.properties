# --- Име на приложението ---
spring.application.name=credit-scoring-sandbox

# --- Връзка с PostgreSQL ---
# Смени credit_scoring / postgres / password с твоите реални стойности
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_scoring
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update - автоматично обновява схемата при промяна на entity-та (удобно за development)
# validate/none са по-подходящи за production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server порт (по подразбиране 8080) ---
server.port=8080

# --- JWT конфигурация (примерна стойност, смени я със собствен секрет) ---
jwt.secret=change-this-to-a-long-random-secret-key-before-production
jwt.expiration-ms=86400000